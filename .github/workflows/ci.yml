name: CI

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

jobs:
  lint:
    name: Lint (ruff + mypy)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - name: Create venv and install
        run: uv venv .venv && uv pip install -e ".[dev]"
      - name: Ruff check
        run: .venv/bin/ruff check src/hermit/
      - name: Ruff format check
        run: .venv/bin/ruff format --check src/hermit/ || true
      - name: Mypy strict
        run: .venv/bin/mypy --strict src/hermit/model/__init__.py || true

  test:
    name: Test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - name: Create venv and install
        run: uv venv .venv --python ${{ matrix.python-version }} && uv pip install -e ".[dev]"
      - name: Run tests with coverage
        run: .venv/bin/pytest --cov=hermit --cov-report=term-missing --cov-report=xml
      - name: Upload coverage
        uses: actions/upload-artifact@v4
        with:
          name: coverage-py${{ matrix.python-version }}
          path: coverage.xml
          if-no-files-found: ignore
