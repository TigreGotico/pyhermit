[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "hermit-reasoner"
version = "0.3.0"
description = "A conformant OWL 2 DL tableau reasoner — Python port of HermiT"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.10"
authors = [
    { name = "HermiT Python Port Contributors" },
]
keywords = ["owl", "owl2", "reasoner", "semantic-web", "description-logic", "knowledge-graph", "ontology"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Text Processing :: Indexing",
]
dependencies = []

[project.optional-dependencies]
owlready2 = [
    "owlready2>=0.45",
]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "mypy>=1.0",
    "ruff>=0.1",
]
docs = [
    "sphinx>=6.0",
    "sphinx-rtd-theme>=1.0",
]

[project.scripts]
hermit = "hermit.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/hermit"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --tb=short"

[tool.mypy]
python_version = "3.10"
strict = true
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
warn_unused_ignores = false

[tool.ruff]
target-version = "py310"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B"]
ignore = [
    "N802",   # Function names: keep Java camelCase (getTimeOut, etc.)
    "N818",   # Exception naming: keep Java names (MalformedLiteralException)
    "I001",   # Import sorting: side-effect imports in _register_all()
    "N814",   # CamelCase imported as constant (AtomicConcept as _AC)
    "B027",   # Empty method in abstract base class (create_retrieval default impl)
    "F821",   # Temporarily: TYPE_CHECKING imports for Node/Tableau need cleanup
]

[tool.ruff.lint.per-file-ignores]
# Vendored from owlapy — style issues are pre-existing, not worth modifying
"src/hermit/owl_model/**" = ["E501", "N801", "B904"]

# ---------------------------------------------------------------------------
# mypy per-module overrides — pre-existing type debt
